title: NTDS.dit Extraction via Volume Shadow Copy
id: d0a6fc0e-3db6-4ce1-b7e4-0f1a2b5c6d7e
status: stable
description: |
  Detects attempts to extract the Active Directory database (ntds.dit) using
  Volume Shadow Copy (vssadmin, wmic shadowcopy) or ntdsutil. This technique
  allows offline extraction of all domain password hashes.
author: Vemula Moksha
date: 2026/10/25
tags:
  - attack.credential_access
  - attack.t1003.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_vss_ntds:
    CommandLine|contains:
      - 'vssadmin'
      - 'wmic shadowcopy'
      - 'ntdsutil'
    CommandLine|contains:
      - 'ntds'
      - 'shadow'
      - 'create'
      - 'IFM'
      - 'activate instance ntds'
  selection_copy_ntds:
    CommandLine|contains:
      - 'copy'
      - 'esentutl'
    CommandLine|contains:
      - 'ntds.dit'
      - 'SYSTEM'
  filter_legitimate_backup:
    ParentImage|endswith:
      - '\veeam.backup.shell.exe'
      - '\wbadmin.exe'
  condition: (selection_vss_ntds or selection_copy_ntds) and not filter_legitimate_backup
falsepositives:
  - Veeam Backup performing scheduled AD backups
  - Windows Server Backup (wbadmin) operations
level: critical
custom:
  mitre_technique: T1003.003
  mitre_tactic: credential_access
  tp_file: tests/tp/T1003.003_ntds_dit.json
  tuning_notes: >
    Excluded Veeam and wbadmin backup operations. NTDS.dit extraction outside
    scheduled backup windows is almost always malicious. Critical severity due
    to full domain compromise potential.

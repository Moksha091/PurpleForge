title: UAC Bypass via Fodhelper.exe
id: e5b1ad59-8ec1-4df6-c2f9-5a6b7c0d1e2f
status: stable
description: |
  Detects UAC bypass through fodhelper.exe registry hijacking. Adversaries set
  HKCU\Software\Classes\ms-settings\shell\open\command to execute arbitrary
  commands with elevated privileges without triggering a UAC prompt.
author: Vemula Moksha
date: 2026/10/25
tags:
  - attack.privilege_escalation
  - attack.t1548.002
  - attack.defense_evasion
logsource:
  product: windows
  category: process_creation
detection:
  selection_fodhelper:
    ParentImage|endswith: '\fodhelper.exe'
  selection_child_suspicious:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\mshta.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\rundll32.exe'
  filter_legitimate_settings:
    Image|endswith: '\SystemSettings.exe'
  condition: selection_fodhelper and selection_child_suspicious and not filter_legitimate_settings
falsepositives:
  - Legitimate Windows Settings app launched via fodhelper
level: critical
custom:
  mitre_technique: T1548.002
  mitre_tactic: privilege_escalation
  tp_file: tests/tp/T1548.002_uac_fodhelper.json
  tuning_notes: >
    Only SystemSettings.exe is excluded as a legitimate fodhelper child. Any
    script interpreter spawned by fodhelper.exe is highly suspicious and
    warrants critical severity.

title: Shadow Copy Deletion via vssadmin
id: a5d1cf5d-8ae6-4fb0-e2b9-5c6d7e0f1a2b
status: stable
description: |
  Detects deletion of Volume Shadow Copies using vssadmin.exe or wmic shadowcopy
  delete. Ransomware operators delete shadow copies to prevent recovery of
  encrypted files. This is a pre-encryption indicator in ransomware kill chains.
author: Vemula Moksha
date: 2026/10/25
tags:
  - attack.impact
  - attack.t1490
logsource:
  product: windows
  category: process_creation
detection:
  selection_vssadmin_delete:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  selection_wmic_shadowcopy:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  selection_powershell_vss:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'Get-WmiObject Win32_ShadowCopy'
      - 'Delete()'
      - 'Remove-WmiObject'
  filter_backup_software:
    ParentImage|endswith:
      - '\veeam.backup.shell.exe'
      - '\acronis_agent.exe'
  condition: (selection_vssadmin_delete or selection_wmic_shadowcopy or selection_powershell_vss) and not filter_backup_software
falsepositives:
  - Veeam Backup clearing old shadow copies before new backup
  - Acronis backup agent managing VSS snapshots
level: critical
custom:
  mitre_technique: T1490
  mitre_tactic: impact
  tp_file: tests/tp/T1490_vss_delete.json
  tuning_notes: >
    Excluded Veeam and Acronis backup agents that legitimately manage shadow
    copies. VSS deletion outside backup contexts is a critical ransomware
    indicator and the most reliable pre-encryption detection signal.
